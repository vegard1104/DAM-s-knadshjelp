<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verdensløpet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap">
<style>
  /* Forhåndsvisning: lasteskjermen fyller siden; en liten styrelinje ligger over den. */
  :root {
    --bg: #F2F2F7; --fg: #000000; --fg2: #606066; --flate: rgba(255, 255, 255, .78); --kant: rgba(0, 0, 0, .08);
    --f-ui: -apple-system, 'SF Pro Text', 'Instrument Sans', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0E0F13; --fg: #F4F5F7; --fg2: #9BA2AE; --flate: rgba(29, 32, 39, .82); --kant: rgba(255, 255, 255, .1); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0E0F13; --fg: #F4F5F7; --fg2: #9BA2AE; --flate: rgba(29, 32, 39, .82); --kant: rgba(255, 255, 255, .1); color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-ui); overflow: hidden; }

  .styr {
    position: fixed; z-index: 2147483001; left: 0; right: 0; margin-inline: auto; width: max-content;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px;
    max-width: calc(100% - 32px); padding: 6px 8px; border-radius: 20px;
    background: var(--flate); border: 1px solid var(--kant);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    font-size: 13px;
  }
  .seg { display: flex; gap: 2px; }
  .seg button, .klar {
    font: inherit; font-weight: 600; color: var(--fg2); background: none; border: 0;
    padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { color: var(--fg); background: var(--kant); }
  .klar { color: var(--fg); background: var(--kant); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

  .appen {
    height: 100%; display: grid; place-content: center; justify-items: center; gap: 10px;
    padding-inline: 16px; text-align: center;
  }
  .appen h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
  .appen p { margin: 0; color: var(--fg2); max-width: 32ch; line-height: 1.45; }
</style>
<style>
/* =============================================================
   Lasteskjermen «Verdensløpet» — lag og tekst.
   Scenen tegnes av lasteskjerm.js. Alt som skal bevege seg mens
   hovedtråden er opptatt (fremdriftslinja, tekstbyttene, uttoningen)
   er CSS-animasjoner på transform/opacity, så nettleseren kan kjøre dem
   uten hovedtråden.
   Fargene settes av lasteskjerm.js (--ls-bg, --ls-ink, --ls-aksent) ut
   fra drakten og hovedfargen brukeren har valgt i appen. De styres ikke
   av styles.css, fordi mer.jsx ikke har satt data-theme ennå når
   lasteskjermen vises.
   ============================================================= */
.ls {
  --ls-bg: #F2F2F7;
  --ls-ink: #000000;
  --ls-aksent: #5E5CE6;
  --ls-ink2: color-mix(in srgb, var(--ls-ink) 55%, var(--ls-bg));
  --ls-ink3: color-mix(in srgb, var(--ls-ink) 42%, var(--ls-bg));
  position: fixed; inset: 0; z-index: 2147483000;
  overflow: hidden;
  background: var(--ls-bg);
  color: var(--ls-ink);
  font-family: var(--f-ui, -apple-system, 'Instrument Sans', system-ui, sans-serif);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
  transition: opacity .48s ease;
}
.ls--ut { opacity: 0; pointer-events: none; }
.ls-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Teksten står rett under bakkelinja, som ligger på 60 % av høyden
   (BAKKE i lasteskjerm.js – endres de, må begge endres). */
.ls-tekst {
  position: absolute; left: 16px; right: 16px; top: 60%;
  margin-top: 30px;
  display: grid; justify-items: center; gap: 3px;
  text-align: center;
}
.ls-idrett { font-size: 17px; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
.ls-sted { font-size: 13px; line-height: 1.3; font-weight: 500; color: var(--ls-ink2); }
.ls-bytt { display: inline-block; }
.ls-bytt.inn { animation: ls-inn .5s cubic-bezier(.2, .8, .2, 1); }
@keyframes ls-inn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* Fremdrift. Linja fyller seg mot 92 % på forrige oppstartstid (--ls-tid);
   når appen er klar tones en full linje inn over den. */
.ls-bar {
  position: relative; width: 112px; height: 3px; margin-top: 14px;
  border-radius: 3px; overflow: hidden;
  background: color-mix(in srgb, var(--ls-ink) 10%, transparent);
}
.ls-bar i, .ls-bar b {
  position: absolute; inset: 0; border-radius: inherit;
  background: var(--ls-aksent);
  transform-origin: left center;
}
.ls-bar i { transform: scaleX(0); animation: ls-fram var(--ls-tid, 7s) cubic-bezier(.25, .7, .3, 1) forwards; }
.ls-bar b { opacity: 0; transition: opacity .2s ease; }
.ls--ferdig .ls-bar b { opacity: 1; }
@keyframes ls-fram { to { transform: scaleX(.92); } }

.ls-merke {
  position: absolute; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; justify-content: center; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
  color: var(--ls-ink3);
}
.ls-merke svg { width: 13px; height: 13px; fill: var(--ls-aksent); }

@media (prefers-reduced-motion: reduce) {
  .ls-bytt.inn { animation: none; }
}

</style>

</head>
<body>
<div class="styr" role="toolbar" aria-label="Forhåndsvisning">
  <div class="seg" role="group" aria-label="Drakt">
    <button type="button" id="tema-lys" data-tema="light">Lys</button>
    <button type="button" id="tema-mork" data-tema="dark">Mørk</button>
  </div>
  <button type="button" class="klar" id="klar">Appen er klar</button>
</div>
<main class="appen">
  <h1>Appen er oppe</h1>
  <p>Lasteskjermen toner seg ut idet appen er klar. Trykk «Start på nytt» for å se den igjen.</p>
</main>

<script>
/* Forhåndsvisningen starter alltid på første idrett og sted, og med en
   oppstartstid på 7 s for fremdriftslinja. */
try {
  localStorage.removeItem('at-lasteskjerm');
  localStorage.setItem('at-oppstart-ms', '7000');
} catch (e) { /* uten lager vises standardvalgene */ }
</script>
<script>
/* =============================================================
   AI Trener — lasteskjermen «Verdensløpet»
   Vises mens appen starter: en utøver i aktivitet foran et kjent
   landemerke. Idretten byttes, 1,5 s etter byttes stedet, og så står
   kombinasjonen i 3,2 s før neste idrett.

   Stil (Vegard 28.09: «forenkle … trenger ikke så mye detaljer og
   farger»): appens egen bakgrunn, utøveren som piktogram i idrettens
   farge fra appen (bytter når idretten bytter), landemerket som én blek
   silhuett og en tynn bakkelinje. Ingen himmel, sol, skyer, rekvisitter
   eller startnummer.

   Hvorfor egen tråd: Babel kompilerer de 36 JSX-filene på hovedtråden
   ved hver oppstart. Målt 28.09: 7,4 s til «app-oppe», hvorav 6,5 s var
   lange oppgaver (lengste 0,66 s). En animasjon på hovedtråden ville stått
   stille nesten hele tiden den skulle vises. Scenen tegnes derfor i en
   Web Worker på et OffscreenCanvas. Nettlesere uten det tegner på
   hovedtråden i stedet (hakker under kompileringen, men virker).

   Livsløp:
   · lastes synkront først i <body>, før skallet, så skallet aldri blinker
   · app.jsx kaller ATLasteskjerm.ferdig() idet appen monterer
   · har appen ligget i bakgrunnen i 30 min eller mer, lastes den på nytt
     når du kommer tilbake, og lasteskjermen vises mens den starter
   · tilstanden (neste idrett og sted) huskes i localStorage, så hver
     oppstart fortsetter der forrige slapp

   Ren JS, ikke JSX: fila må kjøre før Babel er lastet.
   ============================================================= */

/* ---------- Scenemotoren ----------------------------------------
   Kjører enten i en Web Worker (vert = null) eller på hovedtråden
   (vert = { post, lerret }). Den kjenner ikke DOM-en: den får et lerret,
   en størrelse og fargene, og sender tekst til hovedtråden med meldinger.
   Funksjonen gjøres om til tekst og startes som worker, så den kan ikke
   bruke noe utenfor seg selv. */
function lasteskjermMotor(vert) {
  'use strict';
  const iWorker = !vert;
  if (iWorker) {
    vert = {
      post: m => self.postMessage(m),
      lerret: (w, h) => new OffscreenCanvas(w, h),
    };
  }
  const raf = typeof self.requestAnimationFrame === 'function'
    ? f => self.requestAnimationFrame(f)
    : f => setTimeout(() => f(performance.now()), 16);
  const caf = typeof self.cancelAnimationFrame === 'function'
    ? id => self.cancelAnimationFrame(id)
    : id => clearTimeout(id);

  const TAU = Math.PI * 2, D2R = Math.PI / 180;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeIn = t => t * t * t;
  const fract = x => x - Math.floor(x);

  /* ---------- farger ---------- */
  function hx(c) {
    if (typeof c !== 'string') return c;
    let s = c.slice(1);
    if (s.length === 3) s = s.replace(/./g, '$&$&');
    const n = parseInt(s, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function mix(a, b, k) { a = hx(a); b = hx(b); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function css(c, al) {
    c = hx(c);
    const r = Math.round(c[0]), gg = Math.round(c[1]), b = Math.round(c[2]);
    return al === undefined || al >= 1 ? `rgb(${r},${gg},${b})` : `rgba(${r},${gg},${b},${Math.max(0, al).toFixed(3)})`;
  }

  // Alle fargene i scenen kommer fra appen: bakgrunn og tekst fra drakten,
  // utøveren fra idrettsfargene. Resten er blandinger av dem.
  let P = null;
  function settPalett(p) {
    p = p || {};
    const bg = p.bg || '#F2F2F7', ink = p.ink || '#000000', ak = p.aksent || '#5E5CE6', mork = !!p.mork;
    // Kroppen i idrettens farge: nær side i full farge, armen og beinet bak
    // blandet halvveis mot bakgrunnen.
    const kropp = c => ({ naer: css(c), fjern: css(mix(c, bg, .5)) });
    const idrett = {};
    for (const k in (p.idrett || {})) idrett[k] = kropp(p.idrett[k]);
    P = {
      bg: css(bg),
      idrett,
      reserve: kropp(ak),                               // idrett uten egen farge
      utstyr: css(mix(bg, ink, mork ? .52 : .45)),      // sykkel, ski, båt …
      utstyrFjern: css(mix(bg, ink, mork ? .3 : .25)),
      lm: css(mix(bg, ink, mork ? .1 : .075)),          // landemerket
      linje: mix(bg, ink, mork ? .32 : .24),            // bakken
      vann: css(bg, .62),                               // det som er under vannflaten
    };
  }

  /* ---------- vektorer ---------- */
  const add = (p, v, L = 1) => [p[0] + v[0] * L, p[1] + v[1] * L];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const norm = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
  const along = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  const dn = deg => { const r = deg * D2R; return [Math.sin(r), Math.cos(r)]; };   // 0 = rett ned, + = framover
  const up = deg => { const r = deg * D2R; return [Math.sin(r), -Math.cos(r)]; };  // 0 = rett opp, + = framover
  const limb = (p, deg, L) => add(p, dn(deg), L);
  // To-ledds invers kinematikk. Returnerer [midtledd, endepunkt].
  function ik(a, b, L1, L2, bend) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const d0 = Math.hypot(dx, dy) || 1e-3;
    const d = clamp(d0, Math.abs(L1 - L2) + .5, L1 + L2 - .05);
    const base = Math.atan2(dy, dx);
    const A = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    return [
      [a[0] + Math.cos(base + bend * A) * L1, a[1] + Math.sin(base + bend * A) * L1],
      [a[0] + dx / d0 * d, a[1] + dy / d0 * d]
    ];
  }

  /* ---------- tegneprimitiver (g = aktiv kontekst) ---------- */
  let g = null;
  function seg(a, b, w, c) { g.lineWidth = w; g.strokeStyle = c; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  function dot(p, r, c) { g.fillStyle = c; g.beginPath(); g.arc(p[0], p[1], r, 0, TAU); g.fill(); }
  function ring(p, r, w, c) { g.lineWidth = w; g.strokeStyle = c; g.beginPath(); g.arc(p[0], p[1], r, 0, TAU); g.stroke(); }
  function sti(pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); }
  function poly(pts, c) { g.fillStyle = c; sti(pts); g.fill(); }
  function box(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
  function roundArch(x, yb, w, h, c) {
    g.fillStyle = c; g.beginPath(); g.moveTo(x - w / 2, yb); g.lineTo(x - w / 2, yb - h + w / 2);
    g.arc(x, yb - h + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w / 2, yb); g.closePath(); g.fill();
  }
  function pointArch(x, yb, w, h, c) {
    g.fillStyle = c; g.beginPath(); g.moveTo(x - w / 2, yb); g.lineTo(x - w / 2, yb - h * .6);
    g.quadraticCurveTo(x - w / 2, yb - h * .92, x, yb - h); g.quadraticCurveTo(x + w / 2, yb - h * .92, x + w / 2, yb - h * .6);
    g.lineTo(x + w / 2, yb); g.closePath(); g.fill();
  }
  // Skjærer ut av det som alt er tegnet (a < 1 gir en lysere flate i
  // stedet for et hull). Gir buer, vinduer og skiller uten en ny farge.
  const UT = '#000';
  function ut(fn, a = 1) { g.save(); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = a; fn(); g.restore(); }

  /* ================================================================
     KROPP – piktogram i idrettens farge. Enheter: ca. 100 = en person.
     y = 0 er bakken. K settes per utøver før den tegnes.
     ================================================================ */
  let K = null;
  const farge = far => far ? K.fjern : K.naer;

  function drawLeg(hip, knee, foot, far, o = {}) {
    const c = farge(far);
    seg(hip, knee, 9.4, c);
    seg(knee, foot, 7.8, c);
    const d = norm(sub(foot, knee));
    if (o.toe) { seg(foot, add(foot, d, 5), 4.4, c); return; }
    if (o.shoe === false) return;
    const f = o.footDir || [d[1], -d[0]];
    const b = add(foot, d, 1.2);
    seg(add(b, f, -1.4), add(b, f, 5.2), 4.6, c);
  }
  // Den nære armen får en smal luftspalte rundt underarmen, så den skiller
  // seg fra kroppen den krysser (klassisk piktogramgrep). Ikke der hånda
  // holder i noe (styre, drivring), da ville spalten kuttet utstyret.
  function drawArm(sh, el, hand, far, luft = true) {
    const c = farge(far);
    if (!far && luft) ut(() => seg(el, hand, 9.6, UT));
    seg(sh, el, 7.2, c);
    seg(el, hand, 6.2, c);
    dot(hand, 3.3, c);
  }
  function drawTorso(hip, neck, A) {
    seg(hip, neck, A.gender === 'f' ? 12.2 : 13.4, K.naer);
  }
  function drawHead(neck, hc, A, o = {}) {
    const r = A.gender === 'f' ? 6.9 : 7.3;
    seg(neck, along(neck, hc, .6), 5.2, K.naer);
    g.save(); g.translate(hc[0], hc[1]); if (o.rot) g.rotate(o.rot);
    // hestehale – det eneste som skiller kvinne og mann
    if (A.gender === 'f' && !o.badehette) {
      const s = o.sway || 0;
      g.strokeStyle = K.naer; g.lineWidth = 4.4;
      g.beginPath(); g.moveTo(-r * .6, -r * .5);
      g.quadraticCurveTo(-r - 4.5, -r * .75 + s * 1.2, -r - 9, 1.2 + s * 3.4); g.stroke();
      g.lineWidth = 2.6; g.beginPath(); g.moveTo(-r - 6.5, -1.2 + s * 2.3); g.lineTo(-r - 11, 3.6 + s * 4.2); g.stroke();
    }
    dot([0, 0], r, K.naer);
    g.restore();
  }
  function wheel(c, R, rot, col) {
    ring(c, R - 1.2, 2.4, col);
    g.lineWidth = 1; g.strokeStyle = col; g.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = rot + i * TAU / 3;
      g.moveTo(c[0], c[1]); g.lineTo(c[0] + Math.cos(a) * (R - 2.4), c[1] + Math.sin(a) * (R - 2.4));
    }
    g.stroke();
  }
  // Det som er under vannflaten tones mot bakgrunnen.
  function underVann(wl, t, bolge) {
    g.save(); g.globalCompositeOperation = 'source-atop';
    g.fillStyle = P.vann; g.beginPath(); g.moveTo(-200, wl);
    for (let x = -200; x <= 200; x += 8) g.lineTo(x, wl + Math.sin(x * .09 + t * 5) * bolge);
    g.lineTo(200, 120); g.lineTo(-200, 120); g.closePath(); g.fill(); g.restore();
  }

  /* ================================================================
     IDRETTER
     ================================================================ */
  const SPORTS = {};

  /* ---- Løping ---- */
  SPORTS.run = {
    name: 'Løping', ground: 'land', speed: 1,
    draw(A) {
      const th = A.t / .68 * TAU;
      const hip = [0, -53.4 + 2.2 * Math.cos(2 * th)];
      const lean = 11 + 1.5 * Math.cos(2 * th);
      const tv = up(lean), neck = add(hip, tv, 29), sh = add(hip, tv, 25.5);
      const hc = add(neck, up(lean + 6), 9.2);
      const leg = ph => {
        const a = 10 + 36 * Math.sin(ph), f = 16 + 100 * Math.pow(Math.max(0, Math.cos(ph + .3)), 2);
        const k = limb(hip, a, 26); return [k, limb(k, a - f, 26)];
      };
      const arm = ph => {
        const a = 4 - 42 * Math.sin(ph), f = 88 - 16 * Math.sin(ph);
        const e = limb(sh, a, 16); return [e, limb(e, a + f, 14.5)];
      };
      const ln = leg(th), lf = leg(th + Math.PI), an = arm(th), af = arm(th + Math.PI);
      drawArm(sh, af[0], af[1], true);
      drawLeg(hip, lf[0], lf[1], true);
      drawTorso(hip, neck, A);
      drawLeg(hip, ln[0], ln[1], false);
      drawHead(neck, hc, A, { sway: Math.sin(2 * th - .6) });
      drawArm(sh, an[0], an[1], false);
    }
  };

  /* ---- Sykling ---- */
  SPORTS.bike = {
    name: 'Sykling', ground: 'land', speed: 2.1,
    draw(A) {
      const cad = A.t / .6 * TAU, R = 17.5, rot = A.dist / R;
      const rear = [-29, -R], front = [30, -R], bb = [0, -12.5];
      const hip = [-12, -53], lean = 57 + 1.2 * Math.sin(cad * 2);
      const tv = up(lean), neck = add(hip, tv, 28.5), sh = add(hip, tv, 25);
      const hc = add(neck, [6, -5.2]);
      const cr = 8.5;
      const pn = [bb[0] + Math.cos(cad) * cr, bb[1] + Math.sin(cad) * cr];
      const pf = [bb[0] - Math.cos(cad) * cr, bb[1] - Math.sin(cad) * cr];
      const hood = [28, -47.2];
      const kn = ik(hip, pn, 26, 25, -1), kf = ik(hip, pf, 26, 25, -1);
      const en = ik(sh, hood, 16, 14.5, 1), ef = ik(sh, [hood[0] - 1.2, hood[1] - .8], 16, 14.5, 1);
      const u = P.utstyr;
      wheel(rear, R, rot, u); wheel(front, R, rot, u);
      seg(bb, pf, 2.2, P.utstyrFjern);
      drawLeg(hip, kf[0], kf[1], true, { footDir: [1, .1] });
      drawArm(sh, ef[0], ef[1], true);
      const seatC = [-8.5, -39], htTop = [21, -42.5], htBot = [23.5, -33];
      seg(rear, bb, 2.4, u); seg(rear, seatC, 2.2, u);
      seg(bb, seatC, 2.8, u); seg(seatC, htTop, 2.8, u); seg(bb, htBot, 3, u);
      seg(htTop, htBot, 3.2, u); seg(htBot, front, 2.6, u);
      seg(seatC, [-10.5, -48], 2.2, u); seg([-15.5, -49.4], [-6.5, -49.9], 3, u);
      seg(htTop, [25, -45.5], 2.4, u);

    { lm: 'bigben', navn: 'Big Ben', by: 'London' },
    { lm: 'liberty', navn: 'Frihetsgudinnen', by: 'New York' },
    { lm: 'rio', navn: 'Kristus-statuen', by: 'Rio de Janeiro' },

    const forventet = Math.min(20000, Math.max(2500, Number(les(localStorage, K_OPPSTART)) || 7000));
    el.style.setProperty('--ls-tid', forventet + 'ms');

    const onMelding = m => {
      if (!m || !aktiv) return;
      if (m.type === 'aktivitet') bytt(felt('idrett'), m.navn);
      else if (m.type === 'sted') bytt(felt('sted'), m.tekst);
      else if (m.type === 'tilstand') skriv(localStorage, K_TILSTAND, JSON.stringify({ ai: m.ai, pi: m.pi, round: m.round }));
    };

    const canvas = el.querySelector('canvas');
    const r = el.getBoundingClientRect();
    let tilstand = null;
    try { tilstand = JSON.parse(les(localStorage, K_TILSTAND) || 'null'); } catch (e) { tilstand = null; }
    const oppstart = {
      type: 'start', w: r.width, h: r.height, dpr: window.devicePixelRatio || 1,
      reduceMotion: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches),
      tilstand, palett: farger,
    };

    const a = aktiv = { el, motor: null, worker: null, ro: null, startet: performance.now(), ferdig: false, grunn };

    // Reserve: samme motor på hovedtråden. Et lerret som er overført til en
    // worker kan ikke brukes igjen, så det byttes ut med et nytt.
    const paHovedtraden = () => {
      if (a.ferdig || a.motor) return;
      const gammelt = el.querySelector('.ls-scene');
      const nytt = document.createElement('canvas');
      nytt.className = 'ls-scene'; nytt.setAttribute('aria-hidden', 'true');
      if (gammelt) gammelt.replaceWith(nytt); else el.insertBefore(nytt, el.firstChild);
      const b = el.getBoundingClientRect();
      const motor = lasteskjermMotor({
        post: onMelding,
        lerret: (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; },
      });
      motor.start(Object.assign({}, oppstart, { canvas: nytt, w: b.width, h: b.height }));
      a.motor = motor;
    };

    let worker = null;
    if (typeof canvas.transferControlToOffscreen === 'function' && typeof Worker === 'function' && typeof OffscreenCanvas === 'function') {
      try {
        const kilde = '(' + lasteskjermMotor.toString() + ')(null);';
        const url = URL.createObjectURL(new Blob([kilde], { type: 'text/javascript' }));
        worker = new Worker(url);
        URL.revokeObjectURL(url);
        worker.onmessage = e => onMelding(e.data);
        // Krasjer workeren (f.eks. en nettleser med halv OffscreenCanvas-
        // støtte), tegner vi videre på hovedtråden i stedet for å fryse.
        worker.onerror = () => {
          if (a.worker !== worker) return;
          a.worker = null; worker.terminate();
          paHovedtraden();
        };
        const off = canvas.transferControlToOffscreen();
        worker.postMessage(Object.assign({ canvas: off }, oppstart), [off]);
        a.worker = worker;
      } catch (e) {
        if (worker) worker.terminate();
        a.worker = null;
      }
    }
    if (!a.worker) paHovedtraden();

    if (typeof ResizeObserver === 'function') {
      aktiv.ro = new ResizeObserver(() => {
        if (!aktiv) return;
        const b = el.getBoundingClientRect();
        const d = { type: 'resize', w: b.width, h: b.height, dpr: window.devicePixelRatio || 1 };
        if (aktiv.worker) aktiv.worker.postMessage(d); else if (aktiv.motor) aktiv.motor.resize(d);
      });
      aktiv.ro.observe(el);
    }
    aktiv.nodstopp = setTimeout(ferdig, NODSTOPP);
  }

  function ferdig() {
    const a = aktiv;
    if (!a || a.ferdig) return;
    a.ferdig = true;
    clearTimeout(a.nodstopp);
    // Husk hvor lang en vanlig oppstart er, så linja treffer neste gang.
    if (a.grunn !== 'pause') {
      const malt = performance.now();
      const gammel = Number(les(localStorage, K_OPPSTART)) || malt;
      skriv(localStorage, K_OPPSTART, String(Math.round(gammel * .6 + malt * .4)));
    }
    const vent = Math.max(0, MIN_SYNLIG - (performance.now() - a.startet));
    setTimeout(() => {
      a.el.classList.add('ls--ferdig', 'ls--ut');
      setTimeout(() => {
        if (a.ro) a.ro.disconnect();
        if (a.worker) { a.worker.postMessage({ type: 'stopp' }); setTimeout(() => a.worker.terminate(), 100); }
        if (a.motor) a.motor.stopp();
        a.el.remove();
        if (aktiv === a) aktiv = null;
      }, UTTONING);
    }, vent);
  }

  /* ---------- Tilbake etter en pause ----------
     Har appen ligget i bakgrunnen i 30 min eller mer, lastes den på nytt så
     dataene er ferske, og lasteskjermen dekker oppstarten. Ikke uten nett
     (da er det ingenting å hente), og ikke hvis du står midt i en tekst. */
  let skjultFra = 0;
  const skriverNoe = () => {
    const a = document.activeElement;
    if (!a) return false;
    const tekstfelt = a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && /^(text|search|email|url|tel|number|)$/i.test(a.type || ''));
    return tekstfelt && String(a.value || '').trim() !== '';
  };
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { skjultFra = Date.now(); return; }
    if (!skjultFra) return;
    const borte = Date.now() - skjultFra;
    skjultFra = 0;
    if (borte < PAUSE_FOR_NY_START || navigator.onLine === false || skriverNoe()) return;
    skriv(sessionStorage, K_GRUNN, 'pause');
    vis('pause');
    // To bilder, så lasteskjermen rekker å vises før siden byttes ut.
    requestAnimationFrame(() => requestAnimationFrame(() => location.reload()));
  });

  window.ATLasteskjerm = { ferdig, vis };

  const grunn = les(sessionStorage, K_GRUNN);
  fjern(sessionStorage, K_GRUNN);
  vis(grunn === 'pause' ? 'pause' : 'start');
})();

</script>
<script>
(function () {
  const root = document.documentElement;
  const les = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const skriv = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignoreres */ } };
  const mork = () => {
    const t = root.getAttribute('data-theme');
    return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  };
  const klar = document.getElementById('klar');

  function tegnStyr() {
    const m = mork();
    document.querySelectorAll('[data-tema]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.tema === 'dark') === m)));
    klar.textContent = document.querySelector('.ls') ? 'Appen er klar' : 'Start på nytt';
  }

  // Lukk den som vises (med uttoning), og vis en ny når den er borte.
  let venter = false;
  function startPaNytt() {
    if (venter) return;
    venter = true;
    window.ATLasteskjerm.ferdig();
    (function sjekk() {
      if (document.querySelector('.ls')) return setTimeout(sjekk, 60);
      skriv('at-oppstart-ms', '7000');
      window.ATLasteskjerm.vis('start');
      venter = false; tegnStyr();
    })();
  }

  document.querySelectorAll('[data-tema]').forEach(b => b.addEventListener('click', () => {
    root.setAttribute('data-theme', b.dataset.tema);
    tegnStyr(); startPaNytt();
  }));
  klar.addEventListener('click', () => {
    if (document.querySelector('.ls')) {
      window.ATLasteskjerm.ferdig();
      (function sjekk() { if (document.querySelector('.ls')) return setTimeout(sjekk, 60); skriv('at-oppstart-ms', '7000'); tegnStyr(); })();
    } else {
      window.ATLasteskjerm.vis('start'); tegnStyr();
    }
  });
  tegnStyr();
})();
</script>

<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Animert lasteskjerm: utøvere i ulike idretter foran kjente landemerker.">
<title>Verdensløpet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --night: #0D1424;
    --glass: rgba(11, 17, 31, .58);
    --glass-hover: rgba(24, 33, 56, .78);
    --line: rgba(255, 255, 255, .16);
    --text: #F5F7FB;
    --muted: rgba(233, 239, 248, .78);
    --faint: rgba(233, 239, 248, .56);
    --bib: #FBFAF5;
    --bib-ink: #141925;
    --bib-sub: #6A7282;
    --pin: #A7AFBC;
    --accent: #FFB23E;
    --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html { height: 100%; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--night); color: var(--text);
    font-family: var(--body); -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .top {
    position: absolute; inset: 0 0 auto 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; pointer-events: none;
  }
  .brand {
    flex: none;
    display: inline-flex; align-items: center; gap: 8px;
    font: 700 15px/1 var(--display); letter-spacing: .16em; text-transform: uppercase;
    padding: 8px 13px 8px 10px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .brand svg { width: 16px; height: 16px; flex: none; }
  .controls { display: flex; flex-wrap: nowrap; justify-content: flex-end; gap: 6px; pointer-events: auto; }
  .btn {
    appearance: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line); color: var(--text);
    font: 600 13px/1 var(--body);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .15s ease;
  }
  .btn:hover { background: var(--glass-hover); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 14px; height: 14px; flex: none; }
  .btn .tempo { font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: center; }

  .hud {
    position: absolute; left: 16px; right: 16px; bottom: 16px;
    margin-inline: auto; max-width: 440px;
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px 14px;
    padding: 14px 16px 15px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 30px rgba(4, 8, 18, .28);
  }
  .bib {
    position: relative; width: 66px; padding: 9px 0 6px; border-radius: 6px;
    display: grid; justify-items: center; gap: 3px;
    background: var(--bib); color: var(--bib-ink);
    box-shadow: 0 2px 0 rgba(0, 0, 0, .22);
    transform: rotate(-2deg);
  }
  .bib::before, .bib::after {
    content: ""; position: absolute; top: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--pin);
  }
  .bib::before { left: 5px; }
  .bib::after { right: 5px; }
  .bib-no { font: 700 30px/.9 var(--display); font-variant-numeric: tabular-nums; }
  .bib-sub { font: 600 9px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--bib-sub); }
  .info { min-width: 0; display: grid; gap: 3px; }
  .sport { font: 700 26px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
  .place { font: 500 15px/1.25 var(--body); color: var(--muted); }
  .coord { font: 500 12.5px/1.3 var(--body); color: var(--faint); font-variant-numeric: tabular-nums; }
  .swap { display: inline-block; }
  .nw { white-space: nowrap; }
  .swap.in { animation: rise .55s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  .load { grid-column: 1 / -1; display: grid; gap: 8px; }
  .load-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 13px/1.2 var(--body); color: var(--muted); }
  .pct { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .bar { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .15); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); }

  @media (max-width: 520px) {
    .btn .lbl { display: none; }
    .btn { padding: 9px; }
    .sport { font-size: 23px; }
  }
  @media (max-height: 460px) {
    .hud { padding: 10px 14px 11px; gap: 8px 12px; }
    .bib { width: 56px; padding: 7px 0 5px; }
    .bib-no { font-size: 25px; }
    .sport { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .swap.in { animation: none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="scene" role="img" aria-label="Animert lasteskjerm"></canvas>

  <div class="top">
    <span class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.5 3.9 5.5 3.9 9s-1.3 6.5-3.9 9M12 3C9.4 5.5 8.1 8.5 8.1 12s1.3 6.5 3.9 9"/></svg>
      Verdensløpet
    </span>
    <div class="controls" role="toolbar" aria-label="Testkontroller">
      <button class="btn" id="btnPause" type="button" aria-pressed="false" title="Pause (mellomrom)">
        <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>
        <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 4.8v14.4c0 .8.9 1.3 1.6.9l11.2-7.2c.6-.4.6-1.4 0-1.8L8.6 3.9C7.9 3.5 7 4 7 4.8Z"/></svg>
        <span class="lbl" id="lblPause">Pause</span>
      </button>
      <button class="btn" id="btnAct" type="button" title="Ny aktivitet (A)" aria-label="Ny aktivitet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14.5" cy="4.5" r="2"/><path d="m8 21 3.5-6 3 2.5V22M6 12l3-4h5l2.5 3.5L20 12M11.5 8 9.5 14"/></svg>
        <span class="lbl">Ny aktivitet</span>
      </button>
      <button class="btn" id="btnPlace" type="button" title="Nytt sted (S)" aria-label="Nytt sted">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <span class="lbl">Nytt sted</span>
      </button>
      <button class="btn" id="btnTempo" type="button" title="Tempo (T)" aria-label="Tempo 1×">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 16a7.5 7.5 0 1 1 15 0"/><path d="m12 16 3.5-4.5"/></svg>
        <span class="tempo" id="lblTempo">1×</span>
      </button>
    </div>
  </div>

  <div class="hud">
    <div class="bib" aria-hidden="true"><span class="bib-no" id="bibNo">214</span><span class="bib-sub">Startnr.</span></div>
    <div class="info">
      <div class="sport"><span class="swap" id="sport">Løping</span></div>
      <div class="place"><span class="swap" id="city">Oslo, Norge</span></div>
      <div class="coord"><span class="swap" id="coord">Holmenkollbakken · <span class="nw">59,964° N 10,668° Ø</span></span></div>
    </div>
    <div class="load">
      <div class="load-row"><span id="msg" aria-live="polite">Laster inn økten din</span><span class="pct" id="pct">0 %</span></div>
      <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================================================================
   Verdensløpet – animert lasteskjerm
   Utøvere i ulike idretter foran kjente landemerker. Aktivitet og
   bakgrunn byttes annenhver gang. Alt tegnes prosedyrisk i canvas.
   ================================================================ */

const TAU = Math.PI * 2, D2R = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const fract = x => x - Math.floor(x);
const hash = n => fract(Math.sin(n * 127.1 + 311.7) * 43758.5453);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- farger ---------- */
const _hx = new Map();
function hx(c) {
  if (typeof c !== 'string') return c;
  let v = _hx.get(c);
  if (!v) {
    let s = c.slice(1);
    if (s.length === 3) s = s.replace(/./g, '$&$&');
    const n = parseInt(s, 16);
    v = [n >> 16 & 255, n >> 8 & 255, n & 255];
    _hx.set(c, v);
  }
  return v;
}
function mix(a, b, k) { a = hx(a); b = hx(b); return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
function css(c, al) {
  c = hx(c);
  const r = Math.round(c[0]), gg = Math.round(c[1]), b = Math.round(c[2]);
  return al === undefined || al >= 1 ? `rgb(${r},${gg},${b})` : `rgba(${r},${gg},${b},${Math.max(0, al).toFixed(3)})`;
}
const col = c => (typeof c === 'string' && c[0] !== '#') ? c : css(c);
const darken = (c, k) => mix(c, [10, 14, 26], k);
const lighten = (c, k) => mix(c, [255, 255, 255], k);

/* ---------- vektorer ---------- */
const add = (p, v, L = 1) => [p[0] + v[0] * L, p[1] + v[1] * L];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const norm = v => { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; };
const along = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const dn = deg => { const r = deg * D2R; return [Math.sin(r), Math.cos(r)]; };   // 0 = rett ned, + = framover
const up = deg => { const r = deg * D2R; return [Math.sin(r), -Math.cos(r)]; };  // 0 = rett opp, + = framover
const limb = (p, deg, L) => add(p, dn(deg), L);
// To-ledds invers kinematikk. Returnerer [midtledd, endepunkt].
function ik(a, b, L1, L2, bend) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const d0 = Math.hypot(dx, dy) || 1e-3;
  const d = clamp(d0, Math.abs(L1 - L2) + .5, L1 + L2 - .05);
  const base = Math.atan2(dy, dx);
  const A = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [
    [a[0] + Math.cos(base + bend * A) * L1, a[1] + Math.sin(base + bend * A) * L1],
    [a[0] + dx / d0 * d, a[1] + dy / d0 * d]
  ];
}

/* ---------- tegneprimitiver (g = aktiv kontekst) ---------- */
let g = null;
function seg(a, b, w, c) { g.lineWidth = w; g.strokeStyle = col(c); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
function dot(p, r, c) { g.fillStyle = col(c); g.beginPath(); g.arc(p[0], p[1], r, 0, TAU); g.fill(); }
function ring(p, r, w, c) { g.lineWidth = w; g.strokeStyle = col(c); g.beginPath(); g.arc(p[0], p[1], r, 0, TAU); g.stroke(); }
function poly(pts, c) { g.fillStyle = col(c); g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); }
function box(x, y, w, h, c) { g.fillStyle = col(c); g.fillRect(x, y, w, h); }
function roundArch(x, yb, w, h, c) {
  g.fillStyle = col(c); g.beginPath(); g.moveTo(x - w / 2, yb); g.lineTo(x - w / 2, yb - h + w / 2);
  g.arc(x, yb - h + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w / 2, yb); g.closePath(); g.fill();
}
function pointArch(x, yb, w, h, c) {
  g.fillStyle = col(c); g.beginPath(); g.moveTo(x - w / 2, yb); g.lineTo(x - w / 2, yb - h * .6);
  g.quadraticCurveTo(x - w / 2, yb - h * .92, x, yb - h); g.quadraticCurveTo(x + w / 2, yb - h * .92, x + w / 2, yb - h * .6);
  g.lineTo(x + w / 2, yb); g.closePath(); g.fill();
}

/* ================================================================
   KROPP – piktogramstil. Enheter: ca. 100 = en person. y = 0 er bakken.
   ================================================================ */
const FAR = .3;
const tone = (c, far) => far ? darken(c, FAR) : hx(c);

function drawLeg(hip, knee, foot, L, far, o = {}) {
  const skin = tone(L.skin, far), bot = tone(L.bottom, far);
  const full = L.legs === 'tights';
  seg(hip, knee, 9.6, full ? bot : skin);
  seg(knee, foot, 8, full ? bot : skin);
  if (!full && L.shortLen > 0) seg(hip, along(hip, knee, L.shortLen), 11, bot);
  const d = norm(sub(foot, knee));
  if (o.toe) { seg(foot, add(foot, d, 5.5), 4.2, skin); return; }
  if (o.shoe === false) return;
  const f = o.footDir || [d[1], -d[0]];
  const b = add(foot, d, 1.2);
  seg(add(b, f, -1.4), add(b, f, 5.4), 4.8, tone(L.shoe, far));
}
function drawArm(sh, el, hand, L, far) {
  const skin = tone(L.skin, far), top = tone(L.top, far);
  const lng = L.sleeves === 'long';
  seg(sh, el, 7.2, lng ? top : skin);
  seg(el, hand, 6.2, lng ? top : skin);
  if (L.sleeves === 'short') seg(sh, along(sh, el, .48), 8.4, top);
  dot(hand, 3.3, L.glove ? tone(L.glove, far) : skin);
}
function drawTorso(hip, neck, L) {
  const w = L.gender === 'f' ? 12.2 : 13.4;
  seg(hip, neck, w, L.torsoSkin ? L.skin : L.top);
  if (L.waist) seg(hip, along(hip, neck, L.waist), w + .6, L.bottom);
}
function drawHead(neck, hc, L, o = {}) {
  const r = L.gender === 'f' ? 6.9 : 7.3;
  const hat = L.hat || 'none';
  seg(neck, along(neck, hc, .6), 5.2, L.skin);
  g.save(); g.translate(hc[0], hc[1]); if (o.rot) g.rotate(o.rot);
  // hestehale
  if (L.gender === 'f' && hat !== 'cap' && hat !== 'hood' && hat !== 'aero') {
    const s = o.sway || 0;
    g.strokeStyle = css(L.hair); g.lineWidth = 4.4;
    g.beginPath(); g.moveTo(-r * .6, -r * .5);
    g.quadraticCurveTo(-r - 4.5, -r * .75 + s * 1.2, -r - 9, 1.2 + s * 3.4); g.stroke();
    g.lineWidth = 2.6; g.beginPath(); g.moveTo(-r - 6.5, -1.2 + s * 2.3); g.lineTo(-r - 11, 3.6 + s * 4.2); g.stroke();
  }
  dot([0, 0], r, L.skin);
  if (hat !== 'cap' && hat !== 'hood' && hat !== 'aero') {
    g.fillStyle = css(L.hair); g.beginPath(); g.arc(0, 0, r + .5, 150 * D2R, 335 * D2R); g.closePath(); g.fill();
  }
  switch (hat) {
    case 'helmet': {
      g.fillStyle = css(L.gear2 || '#FFFFFF'); g.beginPath();
      g.ellipse(-1.4, -1.8, r + 2.6, r + .9, -.12, Math.PI * .98, TAU + .05); g.closePath(); g.fill();
      g.strokeStyle = css(L.gear); g.lineWidth = 1.6; g.beginPath();
      g.ellipse(-1.4, -1.8, r + 1.4, r - .2, -.12, Math.PI * 1.08, TAU - .15); g.stroke();
      break;
    }
    case 'cap': {
      g.fillStyle = css(L.gear); g.beginPath(); g.arc(0, 0, r + .55, 118 * D2R, 372 * D2R); g.closePath(); g.fill();
      seg([r * .1, -r * .02], [-r * .95, r * .12], 1.1, '#11161F');
      seg([r * .28, -r * .05], [r * .98, -r * .02], 2.8, '#11161F');
      break;
    }
    case 'hood': {
      dot([0, 0], r + .6, L.top);
      g.fillStyle = css(L.skin); g.beginPath(); g.moveTo(r * .1, 0); g.arc(0, 0, r * .8, -40 * D2R, 62 * D2R); g.closePath(); g.fill();
      seg([r * .3, -r * .3], [r * .98, -r * .2], 2.5, '#11161F');
      break;
    }
    case 'band': {
      g.save(); g.beginPath(); g.arc(0, 0, r + .8, 0, TAU); g.clip();
      seg([-r - 2, -r * .05], [r + 2, -r * .55], 3.4, L.gear); g.restore();
      break;
    }
    case 'beanie': {
      const a0 = 160 * D2R, a1 = 350 * D2R;
      g.fillStyle = css(L.gear); g.beginPath(); g.arc(0, 0, r + 1, a0, a1); g.closePath(); g.fill();
      seg([Math.cos(a0) * (r + 1), Math.sin(a0) * (r + 1)], [Math.cos(a1) * (r + 1), Math.sin(a1) * (r + 1)], 2.6, darken(L.gear, .3));
      dot([-r * .45, -r - 1.6], 2.3, '#FFFFFF');
      break;
    }
    case 'aero': {
      g.fillStyle = css(L.gear); g.beginPath(); g.moveTo(r + 1.6, .2);
      g.arc(0, 0, r + 1.9, .05, Math.PI + .22, true); g.lineTo(-r - 11, .8);
      g.quadraticCurveTo(-r * .3, r * .2, r + 1.6, .2); g.closePath(); g.fill();
      g.strokeStyle = '#7FB6E8'; g.lineWidth = 2.4; g.beginPath(); g.arc(0, 0, r + 1.1, -.55, .12); g.stroke();
      break;
    }
  }
  if (L.glasses) seg([r * .3, -r * .14], [r * 1.02, -r * .08], 2.4, '#141A26');
  g.restore();
}

/* ---------- partikler (snøsprut, vannsprut, støv) ---------- */
function emit(A, x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const life = o.life * rnd(.7, 1.2);
    A.parts.push({
      x: x + rnd(-1, 1) * (o.sx || 0), y: y + rnd(-1, 1) * (o.sy || 0),
      vx: (o.vx || 0) + rnd(-1, 1) * (o.jx || 0), vy: (o.vy || 0) + rnd(-1, 1) * (o.jy || 0),
      gr: o.g === undefined ? 160 : o.g, life, max: life, r: o.r * rnd(.6, 1.3), c: o.c, drift: o.drift === undefined ? 1 : o.drift
    });
  }
}
function crossed(A, key, v) {
  const n = Math.floor(v), prev = A.marks[key];
  A.marks[key] = n;
  return prev !== undefined && n !== prev;
}

/* ================================================================
   IDRETTER
   ================================================================ */
const SPORTS = {};

/* ---- Løping ---- */
SPORTS.run = {
  name: 'Løping', verb: 'løper', ground: 'road', speed: 1, shadow: 24,
  draw(A) {
    const L = A.look, th = A.t / .68 * TAU;
    const hip = [0, -53.4 + 2.2 * Math.cos(2 * th)];
    const lean = 11 + 1.5 * Math.cos(2 * th);
    const tv = up(lean), neck = add(hip, tv, 29), sh = add(hip, tv, 25.5);
    const hc = add(neck, up(lean + 6), 9.2);
    const leg = ph => {
      const a = 10 + 36 * Math.sin(ph), f = 16 + 100 * Math.pow(Math.max(0, Math.cos(ph + .3)), 2);
      const k = limb(hip, a, 26); return [k, limb(k, a - f, 26)];
    };
    const arm = ph => {
      const a = 4 - 42 * Math.sin(ph), f = 88 - 16 * Math.sin(ph);
      const e = limb(sh, a, 16); return [e, limb(e, a + f, 14.5)];
    };
    const ln = leg(th), lf = leg(th + Math.PI), an = arm(th), af = arm(th + Math.PI);
    drawArm(sh, af[0], af[1], L, true);
    drawLeg(hip, lf[0], lf[1], L, true);
    drawTorso(hip, neck, L);

const AX = 190, AY = 165, LWU = 380, LHU = 232;
const layers = [0, 1].map(() => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; });

const STARS = Array.from({ length: 90 }, (_, i) => [hash(i * 3.1), hash(i * 7.7) * .78, .5 + hash(i * 1.9) * 1.1, hash(i * 5.3) * TAU]);
const CLOUDS = Array.from({ length: 6 }, (_, i) => [hash(i * 11.3), .1 + hash(i * 4.1) * .34, .7 + hash(i * 2.9) * .7]);

function makeAthlete(entry, round) {
  const sp = SPORTS[entry.sport];
  const gender = entry.fixed || round % 2 === 0 ? entry.gender : (entry.gender === 'm' ? 'f' : 'm');
  const n = st.count++;
  const look = Object.assign({ gender, skin: SKINS[(n * 5 + 2) % SKINS.length], hair: HAIRS[(n * 7 + 1) % HAIRS.length] }, KITS[entry.sport][gender]);
  return { sp, key: entry.sport, look, gender, t: rnd(0, 2), dist: 0, parts: [], marks: {}, bib: 100 + Math.floor(Math.random() * 880) };
}

function layout() {
  const r = stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  portrait = W < H * 1.1;
  U = clamp(Math.min(W / 250, H / 470), .75, 2.4);
  groundY = Math.round(Math.min(H * .68, H - 150));
  horizonY = groundY - 52 * U; trackTop = groundY - 16 * U;
  athX = portrait ? W * .5 : W * .42;
  lmCX = portrait ? W * .52 : W * .6;
  for (const L of layers) { L.c.width = Math.ceil(LWU * U * DPR); L.c.height = Math.ceil(LHU * U * DPR); }
  lmCache.clear();
}

/* ---------- landemerke-cache ---------- */
function landmarkImage(pi) {
  let c = lmCache.get(pi);
  if (c) return c;
  const p = PLACES[pi], lm = LM[p.lm];
  const [x0, x1, h] = lm.box, bw = x1 - x0;
  const maxH = Math.max(60, (horizonY - 72) * .9), maxW = W * (portrait ? 1.05 : .8);
  const s = Math.min(maxH / h, maxW / bw);
  const pad = 6;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil((bw * s + pad * 2) * DPR); cv.height = Math.ceil((h * s + pad * 2) * DPR);
  const lc = cv.getContext('2d');
  lc.setTransform(DPR * s, 0, 0, DPR * s, DPR * (pad - x0 * s), DPR * (pad + h * s));
  lc.lineCap = 'round'; lc.lineJoin = 'round';
  g = lc;
  lm.draw(Object.assign({ f: hx(p.lmc), l: mix(p.lmc, p.sky[1], .45), d: darken(p.lmc, .3) }, p.x || {}));
  c = { cv, w: cv.width / DPR, h: cv.height / DPR, ox: pad - x0 * s, oy: pad + h * s, cx: (x0 + x1) / 2 * s };
  lmCache.set(pi, c);
  return c;
}

function fillR(x, y, w, h, c) { ctx.fillStyle = col(c); ctx.fillRect(x, y, w, h); }
function vgrad(y0, y1, c0, c1) { const gr = ctx.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, css(c0)); gr.addColorStop(1, css(c1)); ctx.fillStyle = gr; ctx.fillRect(0, y0, W, y1 - y0); }

function drawSun(s, a, isMoon) {
  if (!s || a <= .01) return;
  const x = W * s.x, y = horizonY * s.y, r = s.r * U;
  ctx.save(); ctx.globalAlpha = a;
  const gr = ctx.createRadialGradient(x, y, r * .4, x, y, r * (isMoon ? 4 : 5.5));

function update(dt, rawDt) {

  // vignett
  const vg = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(6,10,20,0)'); vg.addColorStop(1, 'rgba(6,10,20,.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const ui = { sport: $('sport'), city: $('city'), coord: $('coord'), bib: $('bibNo'), msg: $('msg'), pct: $('pct'), fill: $('fill') };
function swap(el, text, html) { el.classList.remove('in'); void el.offsetWidth; if (html) el.innerHTML = text; else el.textContent = text; el.classList.add('in'); }
function describe() {
  const A = st.cur, p = PLACES[st.place];
  cvs.setAttribute('aria-label', `${A.gender === 'f' ? 'Kvinne' : 'Mann'} som ${A.sp.verb} foran ${p.name} i ${p.city.split(',')[0]}`);
}
const TEMPI = [1, 2, .5];
$('btnPause').addEventListener('click', togglePause);
$('btnAct').addEventListener('click', () => { nextActivity(); st.timer = 0; st.nextKind = 'place'; });
$('btnPlace').addEventListener('click', () => { nextPlace(); st.timer = 0; st.nextKind = 'act'; });
$('btnTempo').addEventListener('click', cycleTempo);
function togglePause() {
  st.paused = !st.paused;
  $('btnPause').setAttribute('aria-pressed', String(st.paused));
  $('lblPause').textContent = st.paused ? 'Spill av' : 'Pause';
  $('icoPause').hidden = st.paused; $('icoPlay').hidden = !st.paused;
}
function cycleTempo() {
  st.tempo = TEMPI[(TEMPI.indexOf(st.tempo) + 1) % TEMPI.length];
  const label = st.tempo === .5 ? '½×' : `${st.tempo}×`;
  $('lblTempo').textContent = label; $('btnTempo').setAttribute('aria-label', `Tempo ${label}`);
}
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.code === 'Space' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); togglePause(); }
  else if (e.key === 'a' || e.key === 'A') $('btnAct').click();
  else if (e.key === 's' || e.key === 'S') $('btnPlace').click();
  else if (e.key === 't' || e.key === 'T') cycleTempo();
});

/* ---------- start ---------- */
st.cur = makeAthlete(ACTS[0], 0);
layout();
applyActivityUI(st.cur); applyPlaceUI();
new ResizeObserver(() => { layout(); render(); }).observe(stage);
let last = performance.now();
function frame(now) {
  const raw = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const dt = st.paused ? 0 : raw * st.tempo * (reduceMotion ? .6 : 1);
  update(dt, st.paused ? 0 : raw);
  render();
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);

// Liten API for integrering og testing
window.Verdenslopet = {
  nextActivity: () => $('btnAct').click(),
  nextPlace: () => $('btnPlace').click(),
  pause: () => { if (!st.paused) togglePause(); },
  play: () => { if (st.paused) togglePause(); },
  set(activity, place) {
    if (activity !== undefined) { st.ai = (activity - 1 + ACTS.length) % ACTS.length; nextActivity(); st.actK = 1; st.prev = null; }
    if (place !== undefined) { st.place = (place - 1 + PLACES.length) % PLACES.length; nextPlace(); st.placeK = 1; st.placePrev = -1; }
  },
  sports: ACTS.map(a => a.sport), places: PLACES.map(p => p.id),
};
})();
</script>
</body>
